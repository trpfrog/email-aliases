name: Deploy

# GitHub Release を公開すると、そのタグ（v1.2.3）を本番にデプロイする。
# 同じバージョンを再デプロイするときは、Actions タブの「Run workflow」でタグを選んで実行する
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# デプロイが重ならないようにし、実行中のものは取り消さない
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # v から始まるタグ以外は本番にデプロイしない。
    # この条件はワークフローを編集すれば外せるため、Environment の production 側でも v* のタグだけに制限している
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # タグのコミットが main に含まれているかを確かめるため、履歴をすべて取得する
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup

      # レビューを経ていないコミットに付けたタグを、誤ってデプロイしないようにする
      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME は main に含まれないコミットを指しています"
            exit 1
          fi

      - name: Set the release version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: pnpm exec vp run check
      - run: pnpm exec vp run test

      # Cloudflare の認証情報だけを環境変数に読み込む。Worker Secrets は deploy-prod.ts が読む
      - name: Load Cloudflare credentials
        uses: 1password/load-secrets-action@v5.0.1
        with:
          export-env: true
          version: 2.41.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://Production/email-aliases-deploy/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://Production/email-aliases-deploy/CLOUDFLARE_ACCOUNT_ID

      # deploy-prod.ts が op read・op run で Secret を解決する
      - uses: 1password/install-cli-action@v4.1.0
        with:
          version: 2.41.1

      # マイグレーションはどれも追加だけにしているため、旧コードが動いている間に適用しても壊れない
      - name: Apply D1 migrations
        run: pnpm exec vp run db:migrate:prod

      # APP_VERSION をビルドに埋め込み、Worker のバージョン履歴にもタグとして残す
      - name: Deploy
        run: pnpm exec vp run deploy:prod
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

name: Deploy

# 本番へのデプロイは手動で実行する（Actions タブの「Run workflow」）
on:
  workflow_dispatch:

permissions:
  contents: read

# デプロイが重ならないようにし、実行中のものは取り消さない
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # main 以外のブランチからは本番にデプロイしない。
    # この条件はワークフローを編集すれば外せるため、Environment の production 側でも main だけに制限している
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup

      - run: pnpm exec vp run check
      - run: pnpm exec vp run test

      # Cloudflare の認証情報だけを環境変数に読み込む。Worker Secrets は deploy-prod.ts が読む
      - name: Load Cloudflare credentials
        uses: 1password/load-secrets-action@5.0.1
        with:
          export-env: true
          version: 2.41.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://Production/email-aliases-deploy/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://Production/email-aliases-deploy/CLOUDFLARE_ACCOUNT_ID

      # deploy-prod.ts が op inject・op read で Secret を解決する
      - uses: 1password/install-cli-action@v4.1.0
        with:
          version: 2.41.1

      # マイグレーションはどれも追加だけにしているため、旧コードが動いている間に適用しても壊れない
      - name: Apply D1 migrations
        run: pnpm exec vp run db:migrate:prod

      - name: Deploy
        run: pnpm exec vp run deploy:prod
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

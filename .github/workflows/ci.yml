name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # actions.lock がワークフローと一致し、固定したコミットが上流で検証できることを確認する
  lockfile:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      # フォーマット・Lint・型検査
      - run: pnpm exec vp run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: pnpm exec vp run test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      # cf dev を一時ディレクトリで起動する。Cloudflare の認証は不要
      - run: pnpm exec vp run test:e2e
